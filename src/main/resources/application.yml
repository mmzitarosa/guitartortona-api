spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
  application:
    name: GuitarTortonaV1
  profiles:
    active: local
  jackson:
    default-property-inclusion: non_null
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  security:
    oauth2:
      resourceserver:
        jwt:
          # Validazione del claim "iss" e "aud" dei token emessi da Keycloak.
          issuer-uri: ${KEYCLOAK_ISSUER_URI:https://keycloak.guitar.lab/realms/guitarlab}
          # Chiavi pubbliche: in cluster conviene l'URL interno (http://keycloak.keycloak.svc.cluster.local:8080/realms/guitarlab/protocol/openid-connect/certs)
          # cosi' la JVM non deve fidarsi della CA interna.
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:https://keycloak.guitar.lab/realms/guitarlab/protocol/openid-connect/certs}
          audiences: ${KEYCLOAK_AUDIENCE:guitartortona-api}

  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized

server:
  compression:
    enabled: true
    mime-types:
      - application/json
    min-response-size: 1024

app:
  security:
    # NON disabilitare in staging/produzione: solo il profilo "local" lo spegne
    enabled: true
  cors:
    # Origin del frontend, separati da virgola. Sovrascrivibile con CORS_ALLOWED_ORIGINS
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://vue.guitar.lab,https://vue-staging.guitar.lab}
